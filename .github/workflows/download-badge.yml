name: Update download badge

on:
  schedule:
    # Runs hourly. GitHub starts scheduled runs late or skips them when it is
    # busy (a 4-hour schedule was observed updating only every 4-9 hours), so
    # an hourly schedule keeps the real interval within a few hours.
    # GitHub disables scheduled workflows after 60 days without repository
    # activity; the release trigger below also updates the badge whenever a
    # new release is published.
    - cron: '17 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Compute total downloads and publish badge JSON
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          releases=$(gh api --paginate "repos/${REPO}/releases" \
            --jq '.[] | "\(.tag_name),\(([.assets[].download_count] | add) // 0)"')
          total=$(echo "${releases}" | awk -F, '{s+=$2} END {print s+0}')
          message=$(python3 -c "print(format(${total}, ','))")
          echo "Total downloads: ${message}"

          mkdir -p out
          cat > out/downloads.json <<EOF
          {
            "schemaVersion": 1,
            "label": "downloads",
            "message": "${message}",
            "color": "brightgreen"
          }
          EOF

          # Carry a CSV over from the previous badge-data commit, or start it
          # with its header when it does not exist yet. Any other failure stops
          # the run: publishing then would replace the history with an empty
          # file. Fetched raw, because the JSON form of this API returns no
          # content above 1 MB.
          carry_over() {
            if gh api -H "Accept: application/vnd.github.raw" \
                 "repos/${REPO}/contents/$1?ref=badge-data" > "out/$1" 2> fetch.err; then
              if ! head -n 1 "out/$1" | grep -q "^$2"; then
                echo "Unexpected content in $1; not publishing"
                exit 1
              fi
            elif grep -q "HTTP 404" fetch.err; then
              echo "$2" > "out/$1"
            else
              cat fetch.err
              echo "Could not fetch $1; not publishing"
              exit 1
            fi
          }

          # Daily history: one snapshot per day (JST), all releases + TOTAL
          carry_over downloads-history.csv "date,tag,downloads"
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if ! grep -q "^${today}," out/downloads-history.csv; then
            echo "${today},TOTAL,${total}" >> out/downloads-history.csv
            echo "${releases}" | sed "s/^/${today},/" >> out/downloads-history.csv
            echo "History: appended snapshot for ${today}"
          else
            echo "History: snapshot for ${today} already recorded"
          fi

          # Run log: one line per run with the time it actually ran. The daily
          # snapshot above is taken by whichever run comes first after midnight
          # JST, and scheduled runs start hours late, so the daily rows alone
          # cannot tell at what time of day the downloads happen.
          carry_over downloads-hourly.csv "time_jst,total,latest_tag,latest_downloads"
          now=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M)
          latest=$(echo "${releases}" | head -n 1)
          echo "${now},${total},${latest}" >> out/downloads-hourly.csv
          echo "Run log: ${now},${total},${latest}"

          # Publish as a single-commit orphan branch so main history stays clean
          cd out
          git init -q -b badge-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json downloads-history.csv downloads-hourly.csv
          git commit -q -m "Update download badge: ${message}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badge-data
